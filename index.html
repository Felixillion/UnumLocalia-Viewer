<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        UnumLocalia Viewer
    </title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <!-- Zipped file (.ulviewer) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- Favicon -->
     <link
        rel="icon"
        type="image/png"
        href="./favicon.png"
    >

</head>

<body>

<div id="app">

    <!-- MOBILE VERSION (top tabs) -->
    <div id="mobileTopTabs">

        <button id="mobileDataTab">
            Data
        </button>

        <button id="mobileDisplayTab"
            style="display:none;">
            Display
        </button>

        <button id="mobileScreenshotTab"
            style="display:none;">
            Screenshot
        </button>

    </div>


    <!-- Active toolbar (top) -->
    <div id="topbar">

        <div id="dataSection"
            class="mobileTopSection">

            <div class="toolbar-group">
                <button id="loadDemoBtn">
                    Demo
                </button>

                <input
                    type="file"
                    id="ulviewerFile"
                    accept=".ulviewer,.zip"
                >
            </div>

            <!-- Load from a web link (e.g. Dropbox) -->
            <div id="linkBox">

                <div class="toolbar-group">
                    <input
                        type="url"
                        id="dataLinkInput"
                        placeholder="or paste a link to a .ulviewer file"
                        title="Link to a .ulviewer file, e.g. a Dropbox share link"
                    >

                    <button id="loadLinkBtn">
                        Load link
                    </button>
                </div>

                <!-- Shown once a dataset has been loaded from a link -->
                <div
                    id="linkActions"
                    class="toolbar-group"
                >
                    <button
                        id="copyShareLinkBtn"
                        title="Copy a viewer link that opens this dataset"
                        style="display:none;"
                    >
                        Copy share link
                    </button>

                    <button
                        id="downloadAllBtn"
                        title="Download the whole dataset into this browser tab so layers switch on faster. Nothing is saved to disk or uploaded."
                        style="display:none;"
                    >
                        Download all
                    </button>

                    <button
                        id="saveFileBtn"
                        title="Save the .ulviewer file to this computer (downloads folder), to open later with 'Choose file'"
                        style="display:none;"
                    >
                        Save file
                    </button>
                </div>

            </div>

        </div>

        <div class="toolbar-divider"></div>

        <div id="displaySection"
            class="mobileTopSection">
            
            <!-- H&E options -->
            <div class="toolbar-section">
                <div class="toolbar-group">
                    <div class="control-item">
                        <div class="control-label">
                            H&E Opacity
                        </div>

                        <input
                            id="heOpacity"
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value="1"
                        >
                    </div>

                </div>

            </div>

            <div class="toolbar-divider"></div>
        
            <!-- Segmentations -->
            <div class="toolbar-section">
                <div class="section-title">Segmentation</div>

                <div class="toolbar-group">
                    <div class="toolbar-group">
                        <button id="loadSegBtn">
                            Load Cells
                        </button>
                    </div>
                    
                    <div id="segmentationControls">
                        <div class="control-item">
                            <div class="control-label">
                                Cell Colour
                            </div>

                            <input
                                type="color"
                                id="segmentationColor"
                                value="#00ffff"
                            >
                        </div>

                        <div class="control-item">
                            <div class="control-label">
                                Cell Width
                            </div>

                            <input
                                type="range"
                                id="segmentationThickness"
                                min="0.5"
                                max="5"
                                step="0.5"
                                value="0.5"
                            >
                        </div>

                        <div class="control-item">
                            <div class="control-label">
                                Cell Opacity
                            </div>

                            <input
                                type="range"
                                id="segmentationOpacity"
                                min="0"
                                max="1"
                                step="0.05"
                                value="1"
                            >
                        </div>

                        <!-- CLUSTERS (disabled for now)
                        <div class="control-item">
                            <div class="control-label">
                                Cell Fill
                            </div>

                            <select id="cellFillSelect">
                                <option value="">None</option>
                                <option value="csv">Load clusters (CSV)…</option>
                            </select>

                            <input
                                type="file"
                                id="clusterFile"
                                accept=".csv,.tsv,.txt,.gz"
                                style="display:none;"
                            >
                        </div>

                        <div
                            class="control-item"
                            id="cellFillOpacityItem"
                            style="display:none;"
                        >
                            <div class="control-label">
                                Fill Opacity
                            </div>

                            <input
                                type="range"
                                id="cellFillOpacity"
                                min="0"
                                max="1"
                                step="0.05"
                                value="0.5"
                            >
                        </div>
                        END CLUSTERS -->

                        <label class="control-checkbox">
                            <input
                                type="checkbox"
                                id="enableCellSelection"
                            >
                            Cell Info
                        </label>

                    </div>

                </div>

            </div>

        </div>

        <div class="toolbar-divider"></div>

        <!-- Export panel -->
        <div
            id="screenshotSection"
            class="mobileTopSection">
            
            <div class="toolbar-section">

                <div id="exportPanel">
                    <label class="export-item">
                        <span>H&E</span>

                        <input
                            type="checkbox"
                            id="exportHE"
                            checked
                        >
                    </label>

                    <label class="export-item">
                        <span>Genes</span>

                        <input
                            type="checkbox"
                            id="exportGenes"
                            checked
                        >
                    </label>

                    <label class="export-item">
                        <span>Proteins</span>

                        <input
                            type="checkbox"
                            id="exportProteins"
                            checked
                        >
                    </label>

                    <label class="export-item">
                        <span>Cells</span>

                        <input
                            type="checkbox"
                            id="exportSegs"
                            checked
                        >
                    </label>

                    <label class="export-item">
                        <span>Scale Bar</span>

                        <input
                            type="checkbox"
                            id="exportScaleBar"
                            checked
                        >
                    </label>

                </div>

                <div class="toolbar-group">
                    <button id="saveScreenshotBtn">
                        Export
                    </button>
                </div>
            </div>
        </div>
    
    </div>

    <!-- Active proteins/genes -->
    <button id="toggleLayersBtn">
        Active Layers ▼
    </button>
    
    <div id="layerBar">
        <div class="layer-group">
            <strong>Proteins:</strong>
            <div id="activeProteins"></div>
        </div>

        <div class="toolbar-divider"></div>

        <div class="layer-group">
            <strong>Genes:</strong>
            <div id="activeGenes"></div>
        </div>

    </div>

    <!-- Main area -->
    <div id="mainLayout">

        <!-- Protein panel (left) -->
        <div id="proteinPanel">
            <h3>Proteins</h3>

            <div class="mobilePanelTabs">

                <button id="proteinBrowseBtn">
                    Browse
                </button>

                <button id="proteinLoadedBtn">
                    Loaded
                </button>

            </div>

            <div id="proteinBrowseView">

                <input
                    id="proteinSearch"
                    type="text"
                    placeholder="Search proteins..."
                >

                <div
                    id="proteinList"
                    class="search-list"
                ></div>

            </div>

            <div id="proteinLoadedView">

                <h4>
                    Loaded Proteins

                    <button id="clearProteinsBtn">
                        Clear
                    </button>
                </h4>

                <div id="loadedProteins"></div>

            </div>

        </div>

        <!-- Central viewer -->
        <div id="viewerWrapper">

            <div id="viewer"></div>

            <!-- Cell information -->
            <div id="cellInfoPanel">
                No cell selected
            </div>

            <!-- CLUSTERS (disabled for now): cluster legend (cell fills)
            <div id="clusterLegend"></div>
            END CLUSTERS -->

            <!-- Loading / error messages -->
            <div id="statusMsg"></div>

        </div>

        <!-- Gene panel (right) -->
        <div id="genePanel">
            <h3>Genes</h3>

            <div class="mobilePanelTabs">

                <button id="geneBrowseBtn">
                    Browse
                </button>

                <button id="geneLoadedBtn">
                    Loaded
                </button>

            </div>

            <div id="geneBrowseView">

                <input
                    id="geneSearch"
                    type="text"
                    placeholder="Search genes..."
                >

                <div
                    id="geneList"
                    class="search-list"
                ></div>

            </div>

            <div id="geneLoadedView">

                <h4>
                    Loaded Genes

                    <button id="clearGenesBtn">
                        Clear
                    </button>
                </h4>

                <div id="loadedGenes"></div>

            </div>

        </div>

    </div>

    <!-- Side tabs (on phone) -->
    <div id="mobileBar">

        <button id="proteinTab">
            Proteins
        </button>

        <button id="geneTab">
            Genes
        </button>

    </div>

</div>


<!-- TEMPORARY -->

<div id="hiddenControls">

    <div id="dropZone"></div>

    <div id="info"></div>


</div>


<!-- END TEMPORARY -->

<!-- UnumLocalia Viewer script -->
<script src="./main.js"></script>

<!-- Goatcounter -->
<script
    data-goatcounter="https://felixillion.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
</script>

</body>

</html>
